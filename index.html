     <script>
       
       
  const betterFunction = (cb, d) => {
    let timer;
    return (...args) => {
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => {
        cb(...args);
      }, d);
    };
  };

  const callingApi = () => {
    console.log("calling api ");
  };

  const debounce = betterFunction(callingApi, 2000);
